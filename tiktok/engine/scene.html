<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#05060d;font-family:"Inter","Inter Display",sans-serif}
  canvas{position:absolute;inset:0}
  #ov{position:absolute;inset:0;pointer-events:none}
  .kicker{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 40px "Inter";letter-spacing:6px;color:#ffb37a;text-transform:uppercase;text-shadow:0 4px 18px rgba(0,0,0,.8)}
  .title{position:absolute;left:70px;right:150px;top:320px;text-align:center;font:900 96px/1.02 "Inter Display","Inter";color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.85),0 2px 0 rgba(0,0,0,.6)}
  .title b{color:#ff8a3d}
  .sub{position:absolute;left:90px;right:170px;top:0;text-align:center;font:600 50px/1.25 "Inter";color:#f3f0ea;text-shadow:0 4px 20px rgba(0,0,0,.9)}
  .sub b{color:#ffcf9e}
  .chip{position:absolute;top:150px;left:50%;transform:translateX(-50%);padding:14px 30px;border-radius:999px;background:rgba(255,138,61,.16);border:2px solid rgba(255,160,100,.6);color:#ffd2b0;font:700 34px "Inter";letter-spacing:2px;white-space:nowrap}
  .bar{position:absolute;left:90px;right:170px;top:100px;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a3d,#ffcf9e)}
</style>
</head>
<body>
<div id="ov"></div>
<script type="importmap">{"imports":{"three":"/three/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const W = 1080, H = 1920;
const EP = await (await fetch('/episode.json')).json();
const FPS = EP.fps || 30;

// ---------- deterministic random ----------
let seed = 1337;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b1f);
scene.fog = new THREE.Fog(0x0a1030, 14, 55);
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x5570c0, 0x1a1020, 0.9));
const moon = new THREE.DirectionalLight(0x9fb4ff, 0.9);
moon.position.set(-6, 12, 6); moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
Object.assign(moon.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
scene.add(moon);
const lamp = new THREE.PointLight(0xffb070, 30, 14, 1.6);
lamp.position.set(-2.2, 4.2, 0.4); lamp.castShadow = true; lamp.shadow.mapSize.set(512, 512);
scene.add(lamp);
const key = new THREE.DirectionalLight(0xffc89a, 1.3); key.position.set(4, 6, 9); scene.add(key);
const rim = new THREE.PointLight(0x6a8cff, 18, 12, 1.5);
rim.position.set(-2.5, 3, -2.5); scene.add(rim);

const flat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .75, metalness: .05, ...o });

// ---------- ground + street ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), flat(0x14131c));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const walk = new THREE.Mesh(new THREE.BoxGeometry(14, .15, 5), flat(0x2a2733));
walk.position.set(0, .07, 0); walk.receiveShadow = true; scene.add(walk);
// lamp post
const post = new THREE.Group();
const pole = new THREE.Mesh(new THREE.CylinderGeometry(.06, .08, 4.3, 6), flat(0x2b2b33)); pole.position.y = 2.15;
const bulb = new THREE.Mesh(new THREE.IcosahedronGeometry(.22, 0), new THREE.MeshBasicMaterial({ color: 0xffd9a8 }));
bulb.position.y = 4.35;
post.add(pole, bulb); post.position.set(-2.6, 0, -1.2); post.traverse(m => m.castShadow = true); scene.add(post);

// ---------- city ----------
function windowTex(cols, rows) {
  const c = document.createElement('canvas'); c.width = cols * 16; c.height = rows * 24;
  const g = c.getContext('2d'); g.fillStyle = '#0d0f1c'; g.fillRect(0, 0, c.width, c.height);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (rnd() < .38) { g.fillStyle = rnd() < .7 ? '#ffcf8a' : '#9fc3ff'; g.globalAlpha = .55 + rnd() * .45; g.fillRect(x * 16 + 4, y * 24 + 5, 8, 12); }
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; return t;
}
const city = new THREE.Group();
for (let i = 0; i < 46; i++) {
  const w = 1.5 + rnd() * 2.5, h = 3 + rnd() * 14, d = 1.5 + rnd() * 2.5;
  const tex = windowTex(Math.round(w * 3), Math.round(h * 2));
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: 0x1b1e33, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: .55, flatShading: true, roughness: .9 }));
  const ring = i < 22 ? 0 : 1;
  m.position.set((rnd() - .5) * (ring ? 60 : 34), h / 2, -12 - rnd() * (ring ? 30 : 12));
  city.add(m);
}
scene.add(city);
// stars
{
  const p = []; for (let i = 0; i < 700; i++) { p.push((rnd() - .5) * 160, 18 + rnd() * 60, -40 - rnd() * 40); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfd8ff, size: .25, fog: false })));
  const moonBall = new THREE.Mesh(new THREE.IcosahedronGeometry(3, 1), new THREE.MeshBasicMaterial({ color: 0xf2ecd8, fog: false }));
  moonBall.position.set(-18, 34, -70); scene.add(moonBall);
}

// ---------- robot mascot ("Byte") ----------
const robot = new THREE.Group();
const bodyMat = flat(0xe0734a), darkMat = flat(0x2c2f3a), greyMat = flat(0x6d7180), lightMat = flat(0xd9d4cb);
const torso = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.35, .85), bodyMat); torso.position.y = 1.75;
const belt = new THREE.Mesh(new THREE.BoxGeometry(1.3, .18, .9), darkMat); belt.position.y = 1.12;
// chest emblem: glowing hex bolt (original mascot mark)
const emblem = new THREE.Mesh(new THREE.CylinderGeometry(.22, .22, .06, 6), new THREE.MeshBasicMaterial({ color: 0xffd7b0 }));
emblem.rotation.x = Math.PI / 2; emblem.position.set(0, 1.85, .44);
const neck = new THREE.Mesh(new THREE.CylinderGeometry(.16, .2, .25, 6), greyMat); neck.position.y = 2.55;
const head = new THREE.Group(); head.position.y = 3.15;
const skull = new THREE.Mesh(new THREE.BoxGeometry(1.45, 1.05, 1.0), lightMat);
const face = new THREE.Mesh(new THREE.BoxGeometry(1.2, .8, .05), new THREE.MeshStandardMaterial({ color: 0x05060a, roughness: .3, metalness: .4 }));
face.position.z = .51;
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const eyeL = new THREE.Mesh(new THREE.BoxGeometry(.2, .16, .02), eyeMat); eyeL.position.set(-.27, .06, .545);
const eyeR = eyeL.clone(); eyeR.position.x = .27;
const mouth = new THREE.Mesh(new THREE.BoxGeometry(.26, .05, .02), eyeMat); mouth.position.set(0, -.2, .545);
const earL = new THREE.Mesh(new THREE.CylinderGeometry(.18, .18, .14, 8), darkMat); earL.rotation.z = Math.PI / 2; earL.position.x = -.79;
const earR = earL.clone(); earR.position.x = .79;
const ant = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, .45, 5), greyMat); ant.position.y = .74;
const antBall = new THREE.Mesh(new THREE.IcosahedronGeometry(.09, 0), new THREE.MeshBasicMaterial({ color: 0xffb070 })); antBall.position.y = .98;
head.add(skull, face, eyeL, eyeR, mouth, earL, earR, ant, antBall);
function arm(side) {
  const g = new THREE.Group(); g.position.set(side * .78, 2.3, 0);
  const sh = new THREE.Mesh(new THREE.BoxGeometry(.28, .28, .32), darkMat);
  const up = new THREE.Mesh(new THREE.BoxGeometry(.24, .75, .26), bodyMat); up.position.y = -.48;
  const hand = new THREE.Mesh(new THREE.BoxGeometry(.3, .26, .3), greyMat); hand.position.y = -.98;
  g.add(sh, up, hand); return g;
}
const armL = arm(-1), armR = arm(1);
function leg(side) {
  const g = new THREE.Group(); g.position.set(side * .32, 1.0, 0);
  const l = new THREE.Mesh(new THREE.BoxGeometry(.32, .8, .34), darkMat); l.position.y = -.42;
  const f = new THREE.Mesh(new THREE.BoxGeometry(.38, .16, .52), greyMat); f.position.set(0, -.84, .07);
  g.add(l, f); return g;
}
robot.add(torso, belt, emblem, neck, head, armL, armR, leg(-1), leg(1));
robot.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
robot.position.set(0, .15, 0);
scene.add(robot);

// ---------- canvas-texture helpers ----------
function canvasPlane(w, h, px = 512) {
  const c = document.createElement('canvas'); c.width = px; c.height = Math.round(px * h / w);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, .04), [darkMat, darkMat, darkMat, darkMat, new THREE.MeshBasicMaterial({ map: tex, transparent: true }), darkMat]);
  return { mesh, c, g: c.getContext('2d'), tex };
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

// --- prop: documents flying into project box ---
function makeDocs(labels) {
  const grp = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 1.0), new THREE.MeshStandardMaterial({ color: 0xff8a3d, emissive: 0xff6a1a, emissiveIntensity: .35, flatShading: true, transparent: true, opacity: .92 }));
  box.position.set(2.2, .65, 1.2); box.castShadow = true;
  const glow = new THREE.PointLight(0xff8a3d, 0, 5, 1.6); glow.position.set(2.2, 1.6, 1.8);
  grp.add(box, glow);
  const lab = canvasPlane(1.5, .4, 512); lab.g.fillStyle = '#fff'; lab.g.font = '800 80px Inter'; lab.g.textAlign = 'center'; lab.g.fillText('PROYECTO', 256, 105); lab.tex.needsUpdate = true;
  lab.mesh.position.set(2.2, .65, 1.71); grp.add(lab.mesh);
  const docs = labels.map((l, i) => {
    const p = canvasPlane(.85, 1.1, 340);
    const g = p.g; g.fillStyle = '#f7f4ee'; roundRect(g, 0, 0, 340, 440, 26); g.fill();
    g.fillStyle = ['#e0734a', '#3f7d5c', '#4a6fe0'][i % 3]; roundRect(g, 26, 26, 150, 60, 14); g.fill();
    g.fillStyle = '#fff'; g.font = '800 38px Inter'; g.fillText(l, 40, 70);
    g.fillStyle = '#c9c3b8'; for (let k = 0; k < 7; k++) { roundRect(g, 26, 120 + k * 42, 220 + ((k * 53) % 70), 16, 8); g.fill(); }
    p.tex.needsUpdate = true; grp.add(p.mesh); return p.mesh;
  });
  return {
    grp, update(lt, dur) {
      const k = clamp(lt / .6); grp.visible = lt >= 0;
      box.scale.setScalar(back(k)); lab.mesh.scale.setScalar(back(k));
      glow.intensity = 0;
      docs.forEach((d, i) => {
        const st = .5 + i * .9, p = clamp((lt - st) / 1.1), e = ease(p);
        const start = new THREE.Vector3(1.2 + i * .5, 4.6 - i * .25, 1.6);
        const mid = new THREE.Vector3(2.0, 3.6, 2.2);
        const end = new THREE.Vector3(2.2, .8, 1.2);
        const a = start.clone().lerp(mid, e), b = mid.clone().lerp(end, e);
        d.position.copy(a.lerp(b, e));
        d.position.y += Math.sin((lt + i) * 2) * .06 * (1 - e);
        d.rotation.set(-.15 * (1 - e), .4 * (1 - e) - .25, Math.sin(lt * 1.3 + i) * .12 * (1 - e) + e * 1.2);
        d.scale.setScalar(lt < st ? back(clamp((lt - st + .9) / .5)) * 1 : 1 - e * .85);
        d.visible = lt > st - .9 && p < 1;
        if (p > .85 && p < 1) glow.intensity = Math.max(glow.intensity, 40 * (1 - Math.abs(p - .93) / .08));
      });
      if (lt > 3.6) glow.intensity = Math.max(glow.intensity, 12 + Math.sin(lt * 4) * 3);
      box.rotation.y = Math.sin(lt * .8) * .08;
    }
  };
}

// --- prop: artifact screen assembling into an app ---
function makeScreen() {
  const grp = new THREE.Group();
  const p = canvasPlane(2.6, 1.9, 720);
  const frame = new THREE.Mesh(new THREE.BoxGeometry(2.75, 2.05, .08), darkMat); frame.position.z = -.03;
  grp.add(frame, p.mesh);
  grp.position.set(2.2, 3.0, 1.2); grp.rotation.y = -.15;
  const light = new THREE.PointLight(0x9fc3ff, 0, 6, 1.5); light.position.set(1.6, 3.0, 2.6); scene.add(light);
  function draw(prog, lt) {
    const g = p.g, w = p.c.width, h = p.c.height;
    g.fillStyle = '#0f1220'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#1a1e33'; g.fillRect(0, 0, w, 64);
    ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(34 + i * 30, 32, 9, 0, 7); g.fill(); });
    g.fillStyle = '#c9cfe8'; g.font = '600 26px Inter'; g.fillText('mi-app.html', 140, 41);
    // prompt line typed
    const prompt = '"Hazlo como una app"';
    const n = Math.floor(clamp(prog / .25) * prompt.length);
    g.fillStyle = '#ffcf9e'; g.font = '700 34px Inter'; g.fillText(prompt.slice(0, n) + (n < prompt.length && Math.floor(lt * 4) % 2 ? '|' : ''), 40, 120);
    // tiles appear
    const tiles = [[40, 160, 300, 150, '#ff8a3d', 'Ventas', '$12.4k'], [360, 160, 320, 150, '#4a6fe0', 'Usuarios', '1,284'], [40, 330, 640, 290, null]];
    tiles.forEach((t, i) => {
      const q = ease(clamp((prog - .3 - i * .15) / .2)); if (q <= 0) return;
      g.globalAlpha = q; g.fillStyle = '#181c30'; roundRect(g, t[0], t[1] + (1 - q) * 30, t[2], t[3], 18); g.fill();
      if (t[4]) { g.fillStyle = t[4]; g.font = '600 26px Inter'; g.fillText(t[5], t[0] + 24, t[1] + 50); g.fillStyle = '#fff'; g.font = '800 54px Inter'; g.fillText(t[6], t[0] + 24, t[1] + 115); }
      else {
        for (let b = 0; b < 9; b++) {
          const bh = (60 + ((b * 37) % 150)) * ease(clamp((prog - .65 - b * .025) / .2));
          g.fillStyle = b % 2 ? '#ffb37a' : '#ff8a3d'; roundRect(g, t[0] + 34 + b * 66, t[1] + t[3] - 30 - bh, 40, bh, 8); g.fill();
        }
      }
      g.globalAlpha = 1;
    });
    p.tex.needsUpdate = true;
  }
  return {
    grp, update(lt, dur) {
      grp.visible = lt >= 0;
      const k = .97 * back(clamp(lt / .7)); grp.scale.set(k, k, 1);
      grp.position.y = 3.0 + Math.sin(lt * 1.4) * .05;
      draw(clamp((lt - .5) / (dur - 1.8)), lt);
      light.intensity = grp.visible ? 14 * clamp(lt / .7) : 0;
    }, hide() { light.intensity = 0; }
  };
}

// --- prop: prompt card with example ---
function makePrompt(lines) {
  const grp = new THREE.Group();
  const p = canvasPlane(2.5, 2.55, 720);
  grp.add(p.mesh); grp.position.set(2.2, 3.0, 1.2); grp.rotation.y = -.15;
  function draw(prog, lt) {
    const g = p.g, w = p.c.width, h = p.c.height;
    g.fillStyle = '#f7f4ee'; roundRect(g, 0, 0, w, h, 30); g.fill();
    g.fillStyle = '#e0734a'; roundRect(g, 30, 28, 210, 52, 14); g.fill();
    g.fillStyle = '#fff'; g.font = '800 30px Inter'; g.fillText('TU PROMPT', 48, 64);
    const total = lines.reduce((a, l) => a + l.t.length, 0);
    let budget = Math.floor(clamp(prog) * total), y = 160;
    for (const l of lines) {
      const s = l.t.slice(0, Math.max(0, budget)); budget -= l.t.length;
      if (l.box && s.length) { g.fillStyle = 'rgba(224,115,74,.15)'; roundRect(g, 18, y - 50, w - 36, 66 * l.box + 14, 14); g.fill(); }
      g.fillStyle = l.c || '#24222b'; g.font = (l.b ? '800 ' : '600 ') + '44px Inter'; g.fillText(s, 36, y); y += 66;
    }
    p.tex.needsUpdate = true;
  }
  return {
    grp, update(lt, dur) {
      grp.visible = lt >= 0;
      const k = .97 * back(clamp(lt / .7)); grp.scale.set(k, k, 1);
      grp.position.y = 3.0 + Math.sin(lt * 1.4) * .05;
      draw(clamp((lt - .6) / (dur - 2.2)), lt);
    }
  };
}

// ---------- build timeline ----------
let t0 = 0;
const segs = EP.segments.map(s => { const o = { ...s, start: t0 }; t0 += s.dur; return o; });
const TOTAL = t0;
for (const s of segs) {
  if (s.prop === 'docs') s.obj = makeDocs(s.docs || ['PDF', 'XLSX', 'NOTAS']);
  if (s.prop === 'screen') s.obj = makeScreen();
  if (s.prop === 'prompt') s.obj = makePrompt(s.lines);
  if (s.obj) { s.obj.grp.visible = false; scene.add(s.obj.grp); }
}

// camera shots per segment kind
const shots = {
  hook: (k) => ({ pos: [lerp(-.8, 0, k), lerp(4.8, 3.6, k), lerp(11, 7.4, k)], look: [0, lerp(2.9, 3.3, k), 0] }),
  intro: (k) => ({ pos: [lerp(0, .6, k), 3.5, lerp(7.4, 8.6, k)], look: [.3, 3.0, 0] }),
  tip: (k) => ({ pos: [lerp(.8, 1.5, k), lerp(3.0, 3.3, k), lerp(14.5, 13.6, k)], look: [1.3, 2.9, .5] }),
  cta: (k) => ({ pos: [0, lerp(3.4, 3.8, k), lerp(10, 8.2, k)], look: [0, 3.5, 0] }),
};

// ---------- overlay ----------
const ov = document.getElementById('ov');
function overlay(s, lt, t) {
  const inK = ease(clamp(lt / .45)), outK = 1 - ease(clamp((lt - (s.dur - .3)) / .3));
  const a = Math.min(inK, outK);
  const pop = back(clamp(lt / .5));
  let html = `<div class="bar"><i style="width:${(t / TOTAL * 100).toFixed(2)}%"></i></div>`;
  if (s.chip) html += `<div class="chip" style="opacity:${a}">${s.chip}</div>`;
  if (s.kicker) html += `<div class="kicker" style="opacity:${a};transform:translateY(${(1 - inK) * 20}px)">${s.kicker}</div>`;
  if (s.title) html += `<div class="title" style="opacity:${a};transform:scale(${.85 + .15 * pop})">${s.title}</div>`;
  if (s.sub) {
    const words = s.sub.split(' ');
    const shown = Math.ceil(clamp((lt - .4) / Math.max(.8, s.dur * .45)) * words.length);
    html += `<div class="sub" style="top:${s.subTop || 470}px;opacity:${outK}">${words.map((w, i) => `<span style="opacity:${i < shown ? 1 : .0}">${w}</span>`).join(' ')}</div>`;
  }
  ov.innerHTML = html;
}

// ---------- frame ----------
window.TOTAL = TOTAL; window.FPS = FPS;
window.renderFrame = (t) => {
  const s = segs.find(x => t >= x.start && t < x.start + x.dur) || segs[segs.length - 1];
  const lt = t - s.start, k = ease(lt / s.dur);
  // camera
  const sh = shots[s.kind](k);
  camera.position.set(...sh.pos); camera.lookAt(...sh.look);
  // robot life
  const on = clamp((t - .35) / .25);
  const flick = t < 1.0 ? (Math.sin(t * 60) > 0 ? 1 : .25) : 1;
  eyeMat.color.setScalar(on * flick);
  const blink = (t % 3.1) > 2.95 ? .15 : 1;
  eyeL.scale.y = eyeR.scale.y = blink;
  antBall.material.color.setRGB(1, .55 + .35 * Math.sin(t * 5), .3);
  emblem.material.color.setRGB(1, .75 + .2 * Math.sin(t * 3), .55);
  robot.position.y = .15 + Math.sin(t * 2.2) * .02;
  head.rotation.set(Math.sin(t * 1.1) * .04, Math.sin(t * .7) * .12, Math.sin(t * .9) * .03);
  armL.rotation.set(Math.sin(t * 2.2) * .05, 0, -.08);
  armR.rotation.set(Math.sin(t * 2.2 + 1) * .05, 0, .08);
  robot.rotation.y = 0;
  if (s.kind === 'tip') { // robot turns to present the prop
    robot.rotation.y = lerp(0, .35, ease(clamp(lt / .8)));
    head.rotation.y += .25 * ease(clamp(lt / .8));
    armR.rotation.z = lerp(.08, 1.9, ease(clamp((lt - .2) / .6)));
    armR.rotation.x = -.2;
  }
  if (s.kind === 'cta') { // wave
    armR.rotation.z = 2.6 + Math.sin(lt * 9) * .35;
    mouth.scale.x = 1.6;
  } else mouth.scale.x = 1 + (!EP.mouth && s.kind === 'intro' ? .4 * Math.abs(Math.sin(lt * 10)) : 0);
  // lip-sync: envelope of the narration, one value per frame
  const m = EP.mouth ? (EP.mouth[Math.min(EP.mouth.length - 1, Math.round(t * FPS))] || 0) : 0;
  mouth.scale.y = 1 + 5 * m; mouth.position.y = -.2 - .06 * m;
  if (m > .05) mouth.scale.x = Math.max(mouth.scale.x, 1 + .5 * m);
  if (s.kind === 'hook') { // surprised: eyes big
    const z = ease(clamp((lt - 1.2) / .3)); eyeL.scale.set(1 + .3 * z, blink * (1 + .6 * z), 1); eyeR.scale.copy(eyeL.scale);
  } else { eyeL.scale.x = eyeR.scale.x = 1; }
  // props
  for (const x of segs) if (x.obj) {
    const ll = t - x.start;
    if (ll >= 0 && ll < x.dur) x.obj.update(ll, x.dur); else { x.obj.grp.visible = false; x.obj.hide && x.obj.hide(); }
  }
  lamp.intensity = 30 + Math.sin(t * 13) * .6;
  overlay(s, lt, t);
  renderer.render(scene, camera);
};
window.READY = true;
</script>
</body>
</html>
